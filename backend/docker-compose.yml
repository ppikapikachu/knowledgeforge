version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: interview_agent_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: interview_agent
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci

  app:
    build: .
    container_name: interview_agent_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=interview_agent
      - MYSQL_USERNAME=root
      - MYSQL_PASSWORD=root123456
      - JWT_SECRET_KEY=your-production-secret-key-change-this
    depends_on:
      - mysql
    volumes:
      - ./uploads:/app/uploads

volumes:
  mysql_data:
